services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab_password
      POSTGRES_DB: url_shortener
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d url_shortener"]
      interval: 5s
      timeout: 3s
      retries: 5
volumes:
  postgres_data: